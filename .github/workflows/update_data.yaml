name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium
      - name: Download PBF
        run: curl -L -o /tmp/country.osm.pbf https://download.geofabrik.de/africa/malawi-latest.osm.pbf
      - name: Build
        run: python scripts/build_data.py /tmp/country.osm.pbf
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)