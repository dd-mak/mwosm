name: Update road data
on:
  schedule:
    - cron: '0 3 1 * *'      # monthly, 03:00 UTC on the 1st
  workflow_dispatch:          # or run manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update road data $(date -u +%F)" && git push)